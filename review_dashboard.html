<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Review Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f4f5fa;--card:#fff;--tx:#1b1f2a;--mu:#6b7080;--ac:#4f46e5;--bd:#e1e3ee;--ok:#16a34a;--wa:#d97706;--er:#dc2626;--in:#2563eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11131b;--card:#1a1d29;--tx:#eceef6;--mu:#9aa0b4;--ac:#8b84ff;--bd:#2d3248;--ok:#4ade80;--wa:#fbbf24;--er:#f87171;--in:#60a5fa}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
.w{max-width:1100px;margin:auto;padding:16px}
h1{font-size:20px;margin:0}.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:14px}.sub{color:var(--mu);font-size:13px}
button,select,input{font:inherit;color:var(--tx)}button{border:1px solid var(--ac);background:transparent;color:var(--ac);border-radius:8px;padding:6px 12px;cursor:pointer;margin-left:6px}button.p{background:var(--ac);color:#fff}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px}.k .c b{display:block;font-size:26px}.k .c span{color:var(--mu);font-size:12px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}@media(max-width:760px){.g{grid-template-columns:1fr}}
h2{font-size:14px;margin:0 0 10px}
.row{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12.5px}.row .l{width:140px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar{flex:1;height:14px;background:var(--bd);border-radius:7px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}.row .n{width:44px;text-align:right;color:var(--mu);flex:none}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.tools input,.tools select{padding:7px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card)}.tools input{flex:1;min-width:160px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:640px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd);font-size:13px}th{color:var(--mu);font-weight:600;position:sticky;top:0;background:var(--card)}
.b{padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600;display:inline-block}
td select{padding:3px 6px;border:1px solid var(--bd);border-radius:6px;background:var(--card)}
.mu{color:var(--mu)}
</style></head><body><div class="w">
<div class="top"><div><h1>📊 Student Review Dashboard</h1><div class="sub" id="meta"></div></div><div><input type="file" id="f" accept=".xlsx,.xls,.csv" hidden><button onclick="f.click()">📎 Upload Excel</button><button onclick="regen()">🔄 Re-assign slots</button><button class="p" onclick="csv()">⬇ Export CSV</button></div></div>
<div class="k" id="k"></div>
<div class="g"><div class="c"><h2>Progress pipeline</h2><div id="pipe"></div></div><div class="c"><h2>Completion by task type</h2><div id="bytask"></div></div></div>
<div class="g"><div class="c"><h2>⏰ Next reviews</h2><div id="next"></div></div><div class="c"><h2>⚠ Needs attention</h2><div id="att"></div></div></div>
<div class="c"><h2>All students</h2><div class="tools"><input id="q" placeholder="Search name, register no, task..."><select id="fs"></select><select id="ft"></select></div><div class="tw"><table><thead><tr><th>#</th><th>Name</th><th>Task</th><th>Review time</th><th>Status</th></tr></thead><tbody id="tb"></tbody></table></div></div>
<p class="mu">Change a student's status in the table and the whole dashboard updates. Data is saved in this browser.</p>
</div><script>
const ST=["Assigned","Email sent","Submitted","Reviewed","Feedback sent","Needs rework"];
const COL={"Assigned":"var(--mu)","Email sent":"var(--in)","Submitted":"var(--wa)","Reviewed":"var(--ac)","Feedback sent":"var(--ok)","Needs rework":"var(--er)"};
const $=id=>document.getElementById(id);
let S=[["912524104001", "Student One", "student1@example.com", "Poster design"], ["912524104002", "Student Two", "student2@example.com", "Video editing"], ["912524104003", "Karthik Raja", "karthik.raja@example.com", "Content writing"], ["912524104004", "Divya Lakshmi", "divya.lakshmi@example.com", "Registration desk"], ["912524104005", "Arjun Selvam", "arjun.selvam@example.com", "Stage decoration"], ["912524104006", "Meena Krishnan", "meena.krishnan@example.com", "Photography"], ["912524104007", "Vignesh Murugan", "vignesh.murugan@example.com", "Social media posts"], ["912524104008", "Sneha Iyer", "sneha.iyer@example.com", "Certificate preparation"], ["912524104009", "Rahul Venkatesh", "rahul.venkatesh@example.com", "Guest coordination"], ["912524104010", "Anitha Devi", "anitha.devi@example.com", "Announcements / emceeing"], ["912524104011", "Suresh Babu", "suresh.babu@example.com", "Poster design"], ["912524104012", "Kavya Nair", "kavya.nair@example.com", "Video editing"], ["912524104013", "Harish Pandian", "harish.pandian@example.com", "Content writing"], ["912524104014", "Nandhini Rajan", "nandhini.rajan@example.com", "Registration desk"], ["912524104015", "Dinesh Kumar", "dinesh.kumar@example.com", "Stage decoration"], ["912524104016", "Swathi Ramesh", "swathi.ramesh@example.com", "Photography"], ["912524104017", "Prakash Raj", "prakash.raj@example.com", "Social media posts"], ["912524104018", "Deepika Subramanian", "deepika.subramanian@example.com", "Certificate preparation"], ["912524104019", "Gokul Anand", "gokul.anand@example.com", "Guest coordination"], ["912524104020", "Revathi Mohan", "revathi.mohan@example.com", "Announcements / emceeing"], ["912524104021", "Manoj Kannan", "manoj.kannan@example.com", "Poster design"], ["912524104022", "Pooja Balaji", "pooja.balaji@example.com", "Video editing"], ["912524104023", "Sathish Kumar", "sathish.kumar@example.com", "Content writing"], ["912524104024", "Janani Chandran", "janani.chandran@example.com", "Registration desk"], ["912524104025", "Naveen Prasad", "naveen.prasad@example.com", "Stage decoration"], ["912524104026", "Harini Sundar", "harini.sundar@example.com", "Photography"], ["912524104027", "Vishal Arun", "vishal.arun@example.com", "Social media posts"], ["912524104028", "Keerthana Ravi", "keerthana.ravi@example.com", "Certificate preparation"], ["912524104029", "Bharath Siva", "bharath.siva@example.com", "Guest coordination"], ["912524104030", "Lavanya Gopal", "lavanya.gopal@example.com", "Announcements / emceeing"], ["912524104031", "Aditya Menon", "aditya.menon@example.com", "Poster design"], ["912524104032", "Shalini Parthiban", "shalini.parthiban@example.com", "Video editing"], ["912524104033", "Yuvaraj Natarajan", "yuvaraj.natarajan@example.com", "Content writing"], ["912524104034", "Bhavani Shankar", "bhavani.shankar@example.com", "Registration desk"], ["912524104035", "Tharun Vel", "tharun.vel@example.com", "Stage decoration"], ["912524104036", "Ishwarya Das", "ishwarya.das@example.com", "Photography"], ["912524104037", "Mohan Raj", "mohan.raj@example.com", "Social media posts"], ["912524104038", "Gayathri Narayanan", "gayathri.narayanan@example.com", "Certificate preparation"], ["912524104039", "Sanjay Kishore", "sanjay.kishore@example.com", "Guest coordination"], ["912524104040", "Abirami Senthil", "abirami.senthil@example.com", "Announcements / emceeing"], ["912524104041", "Jeevan Kumar", "jeevan.kumar@example.com", "Poster design"], ["912524104042", "Nithya Sree", "nithya.sree@example.com", "Video editing"], ["912524104043", "Ashwin Ganesh", "ashwin.ganesh@example.com", "Content writing"], ["912524104044", "Madhumitha Raman", "madhumitha.raman@example.com", "Registration desk"], ["912524104045", "Pradeep Velu", "pradeep.velu@example.com", "Stage decoration"], ["912524104046", "Sowmya Hari", "sowmya.hari@example.com", "Photography"], ["912524104047", "Lokesh Rao", "lokesh.rao@example.com", "Social media posts"], ["912524104048", "Thenmozhi Arasu", "thenmozhi.arasu@example.com", "Certificate preparation"], ["912524104049", "Ramesh Kumar", "ramesh.kumar@example.com", "Guest coordination"], ["912524104050", "Vaishnavi Anand", "vaishnavi.anand@example.com", "Announcements / emceeing"]].map(r=>({reg:r[0],name:r[1],email:r[2],task:r[3],st:"Assigned"})),DL=null;
const fmt=d=>d.toLocaleString("en-IN",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
function* gen(start){let day=new Date(start);day.setHours(0,0,0,0);while(1){if(day.getDay()!=0){for(const[a,b]of[[10,13],[14,17]]){let t=new Date(day);t.setHours(a,0,0,0);const e=new Date(day);e.setHours(b,0,0,0);while(t.getTime()+6e5<=e.getTime()){yield new Date(t);t=new Date(t.getTime()+6e5)}}}day.setDate(day.getDate()+1)}}
function regen(){DL=new Date(Date.now()+3*864e5);DL.setHours(17,0,0,0);const g=gen(new Date(DL.getTime()+864e5));S.forEach(s=>s.slot=g.next().value.getTime());save();render()}
function save(){try{localStorage.setItem("rb_dash3",JSON.stringify({S,DL:DL&&DL.getTime()}))}catch(e){}}
function load(){try{const x=JSON.parse(localStorage.getItem("rb_dash3")||"null");if(x&&x.S&&x.S.length){S=x.S;DL=x.DL?new Date(x.DL):null}}catch(e){}}
function bar(l,v,t,c){return `<div class="row"><div class="l">${l}</div><div class="bar"><i style="width:${t?v/t*100:0}%;${c?"background:"+c:""}"></i></div><div class="n">${v}/${t}</div></div>`}
function render(){const T=S.length,cnt=s=>S.filter(x=>x.st==s).length;
const done=cnt("Feedback sent"),rev=S.filter(x=>["Reviewed","Feedback sent","Needs rework"].includes(x.st)).length,emailed=S.filter(x=>x.st!="Assigned").length,pend=S.filter(x=>["Assigned","Email sent","Submitted"].includes(x.st)).length;
$("meta").textContent=`${T} students · Deadline: ${DL?fmt(DL):"-"} · Reviews: ${S[0].slot?fmt(new Date(S[0].slot))+" → "+fmt(new Date(S[T-1].slot)):"-"}`;
$("k").innerHTML=[["Total students",T],["Emails sent",emailed],["Reviews done",rev],["Feedback sent",done],["Pending reviews",pend],["Needs rework",cnt("Needs rework")],["Completion",Math.round(done/T*100)+"%"]].map(a=>`<div class="c"><b>${a[1]}</b><span>${a[0]}</span></div>`).join("");
$("pipe").innerHTML=ST.map(s=>bar(s,cnt(s),T,COL[s])).join("");
const tasks=[...new Set(S.map(s=>s.task))];$("bytask").innerHTML=tasks.map(t=>{const a=S.filter(s=>s.task==t);return bar(t,a.filter(s=>s.st=="Feedback sent").length,a.length)}).join("");
const now=Date.now(),up=S.filter(s=>s.slot>=now&&["Assigned","Email sent","Submitted"].includes(s.st)).sort((a,b)=>a.slot-b.slot).slice(0,6);
$("next").innerHTML=up.length?up.map(s=>`<div class="row"><div class="l" style="width:auto;flex:1">${s.name} <span class="mu">· ${s.task}</span></div><div class="n" style="width:auto">${fmt(new Date(s.slot))}</div></div>`).join(""):'<span class="mu">No upcoming reviews.</span>';
const od=S.filter(s=>s.slot<now&&["Assigned","Email sent","Submitted"].includes(s.st)),rw=S.filter(s=>s.st=="Needs rework");
$("att").innerHTML=(od.length?`<div>🔴 ${od.length} review(s) past time and not yet done</div>`:"")+(rw.length?`<div>🟠 ${rw.length} student(s) need rework</div>`:"")+((!od.length&&!rw.length)?'<span class="mu">Nothing urgent. 🎉</span>':"");
table()}
function table(){const q=$("q").value.toLowerCase(),fs=$("fs").value,ft=$("ft").value;
$("tb").innerHTML=S.map((s,i)=>({s,i})).filter(({s})=>(!q||(s.name+s.reg+s.task).toLowerCase().includes(q))&&(!fs||s.st==fs)&&(!ft||s.task==ft)).map(({s,i})=>`<tr><td>${i+1}</td><td>${s.name}<div class="mu" style="font-size:11px">${s.reg}</div></td><td>${s.task}</td><td>${s.slot?fmt(new Date(s.slot)):"-"}</td><td><select data-i="${i}" style="color:${COL[s.st]};font-weight:600">${ST.map(x=>`<option${x==s.st?" selected":""}>${x}</option>`).join("")}</select></td></tr>`).join("")}
$("tb").onchange=e=>{const i=e.target.dataset.i;if(i!=null){S[i].st=e.target.value;save();render()}};
function filters(){$("fs").innerHTML='<option value="">All statuses</option>'+ST.map(s=>`<option>${s}</option>`).join("");$("ft").innerHTML='<option value="">All tasks</option>'+[...new Set(S.map(s=>s.task))].map(s=>`<option>${s}</option>`).join("")}
$("q").oninput=table;$("fs").onchange=table;$("ft").onchange=table;
function csv(){const r=[["Register","Name","Email","Task","Review","Status"]].concat(S.map(s=>[s.reg,s.name,s.email,s.task,s.slot?fmt(new Date(s.slot)):"",s.st]));const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([r.map(x=>x.map(v=>`"${v}"`).join(",")).join("\n")],{type:"text/csv"}));a.download="dashboard.csv";a.click()}
$("f").onchange=e=>{const fl=e.target.files[0];if(!fl)return;const r=new FileReader();r.onload=ev=>{try{const wb=XLSX.read(ev.target.result,{type:"array"});S=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false}).slice(1).filter(x=>x[1]).map(x=>({reg:String(x[0]),name:x[1],email:x[2],task:x[3],st:"Assigned"}));filters();regen()}catch(err){alert("Could not read file. Columns: Register no, Name, Email, Task")}};r.readAsArrayBuffer(fl)};
load();if(!S[0].slot||!DL)regen();filters();render();
</script></body></html>
