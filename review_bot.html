<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>AI Review Bot</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mu:#667;--ac:#4f46e5;--bot:#eceefb;--bd:#dde;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1b1e29;--tx:#eceef6;--mu:#99a;--ac:#7c75ff;--bot:#262a3a;--bd:#333850}}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;display:flex;flex-direction:column;max-width:760px;margin:auto}
header{padding:12px 16px;font-weight:700;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
header small{font-weight:400;color:var(--mu)}
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.m{max-width:88%;padding:10px 13px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
.bot{background:var(--bot);align-self:flex-start}.me{background:var(--ac);color:#fff;align-self:flex-end}
.m table{border-collapse:collapse;font-size:13px;display:block;overflow-x:auto;max-width:100%}.m td,.m th{border:1px solid var(--bd);padding:3px 7px;text-align:left}
.m button,.chips button,#bar button{font:inherit;border:1px solid var(--ac);background:transparent;color:var(--ac);border-radius:18px;padding:5px 12px;cursor:pointer;margin:6px 6px 0 0}
.m button.p,#send{background:var(--ac);color:#fff}
.chips{padding:6px 14px 0;display:flex;flex-wrap:wrap}
#bar{display:flex;gap:8px;padding:10px 14px 14px}#bar input[type=text]{flex:1;padding:11px 14px;border-radius:22px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
#send{margin:0;border-radius:22px;padding:0 18px}
</style></head><body>
<header><span>🤖 AI Review Bot</span><small id="cnt"></small></header>
<div id="chat"></div>
<div class="chips"><button data-c="assign tasks to all students">Assign all tasks</button><button data-c="show schedule">Show schedule</button><button data-c="email student 1">Email student 1</button><button data-c="feedback student 1">Feedback student 1</button><button data-c="help">Help</button></div>
<div id="bar"><input type="file" id="f" accept=".xlsx,.xls,.csv" hidden><button onclick="f.click()" title="Upload Excel">📎</button><input type="text" id="t" placeholder="Type: assign tasks / email student 5 / feedback student 5 ..."><button id="send">Send</button></div>
<script>
let S=[["912524104001", "Student One", "student1@example.com", "Poster design"], ["912524104002", "Student Two", "student2@example.com", "Video editing"], ["912524104003", "Karthik Raja", "karthik.raja@example.com", "Content writing"], ["912524104004", "Divya Lakshmi", "divya.lakshmi@example.com", "Registration desk"], ["912524104005", "Arjun Selvam", "arjun.selvam@example.com", "Stage decoration"], ["912524104006", "Meena Krishnan", "meena.krishnan@example.com", "Photography"], ["912524104007", "Vignesh Murugan", "vignesh.murugan@example.com", "Social media posts"], ["912524104008", "Sneha Iyer", "sneha.iyer@example.com", "Certificate preparation"], ["912524104009", "Rahul Venkatesh", "rahul.venkatesh@example.com", "Guest coordination"], ["912524104010", "Anitha Devi", "anitha.devi@example.com", "Announcements / emceeing"], ["912524104011", "Suresh Babu", "suresh.babu@example.com", "Poster design"], ["912524104012", "Kavya Nair", "kavya.nair@example.com", "Video editing"], ["912524104013", "Harish Pandian", "harish.pandian@example.com", "Content writing"], ["912524104014", "Nandhini Rajan", "nandhini.rajan@example.com", "Registration desk"], ["912524104015", "Dinesh Kumar", "dinesh.kumar@example.com", "Stage decoration"], ["912524104016", "Swathi Ramesh", "swathi.ramesh@example.com", "Photography"], ["912524104017", "Prakash Raj", "prakash.raj@example.com", "Social media posts"], ["912524104018", "Deepika Subramanian", "deepika.subramanian@example.com", "Certificate preparation"], ["912524104019", "Gokul Anand", "gokul.anand@example.com", "Guest coordination"], ["912524104020", "Revathi Mohan", "revathi.mohan@example.com", "Announcements / emceeing"], ["912524104021", "Manoj Kannan", "manoj.kannan@example.com", "Poster design"], ["912524104022", "Pooja Balaji", "pooja.balaji@example.com", "Video editing"], ["912524104023", "Sathish Kumar", "sathish.kumar@example.com", "Content writing"], ["912524104024", "Janani Chandran", "janani.chandran@example.com", "Registration desk"], ["912524104025", "Naveen Prasad", "naveen.prasad@example.com", "Stage decoration"], ["912524104026", "Harini Sundar", "harini.sundar@example.com", "Photography"], ["912524104027", "Vishal Arun", "vishal.arun@example.com", "Social media posts"], ["912524104028", "Keerthana Ravi", "keerthana.ravi@example.com", "Certificate preparation"], ["912524104029", "Bharath Siva", "bharath.siva@example.com", "Guest coordination"], ["912524104030", "Lavanya Gopal", "lavanya.gopal@example.com", "Announcements / emceeing"], ["912524104031", "Aditya Menon", "aditya.menon@example.com", "Poster design"], ["912524104032", "Shalini Parthiban", "shalini.parthiban@example.com", "Video editing"], ["912524104033", "Yuvaraj Natarajan", "yuvaraj.natarajan@example.com", "Content writing"], ["912524104034", "Bhavani Shankar", "bhavani.shankar@example.com", "Registration desk"], ["912524104035", "Tharun Vel", "tharun.vel@example.com", "Stage decoration"], ["912524104036", "Ishwarya Das", "ishwarya.das@example.com", "Photography"], ["912524104037", "Mohan Raj", "mohan.raj@example.com", "Social media posts"], ["912524104038", "Gayathri Narayanan", "gayathri.narayanan@example.com", "Certificate preparation"], ["912524104039", "Sanjay Kishore", "sanjay.kishore@example.com", "Guest coordination"], ["912524104040", "Abirami Senthil", "abirami.senthil@example.com", "Announcements / emceeing"], ["912524104041", "Jeevan Kumar", "jeevan.kumar@example.com", "Poster design"], ["912524104042", "Nithya Sree", "nithya.sree@example.com", "Video editing"], ["912524104043", "Ashwin Ganesh", "ashwin.ganesh@example.com", "Content writing"], ["912524104044", "Madhumitha Raman", "madhumitha.raman@example.com", "Registration desk"], ["912524104045", "Pradeep Velu", "pradeep.velu@example.com", "Stage decoration"], ["912524104046", "Sowmya Hari", "sowmya.hari@example.com", "Photography"], ["912524104047", "Lokesh Rao", "lokesh.rao@example.com", "Social media posts"], ["912524104048", "Thenmozhi Arasu", "thenmozhi.arasu@example.com", "Certificate preparation"], ["912524104049", "Ramesh Kumar", "ramesh.kumar@example.com", "Guest coordination"], ["912524104050", "Vaishnavi Anand", "vaishnavi.anand@example.com", "Announcements / emceeing"]].map(r=>({reg:r[0],name:r[1],email:r[2],task:r[3]}));
let DL=3,GAP=3,deadline=null,slots=null,assigned=false,pending=null,lastSlot=null;
const HELP={"Poster design":"Design a poster with event name, date, time, venue and a catchy tagline.","Video editing":"Edit a 15-20 second promo video with title, music and event details.","Content writing":"Write the event description, a tagline and 3 social media captions.","Registration desk":"Prepare the registration sheet, attendee list and desk flow.","Stage decoration":"Plan the stage layout, backdrop and decoration list with a sketch.","Photography":"Make a shot list and capture sample photos of the event.","Social media posts":"Create 3 post designs and a posting calendar.","Certificate preparation":"Design a certificate template and fill the names from the list.","Guest coordination":"Prepare the guest list, welcome plan and contact schedule.","Announcements / emceeing":"Write the emcee script with announcements and a timeline."};
const $=id=>document.getElementById(id),chat=$("chat");
const fmt=d=>d.toLocaleString("en-IN",{weekday:"long",day:"2-digit",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit"});
function say(h,who="bot",html=false){const d=document.createElement("div");d.className="m "+who;html?d.innerHTML=h:d.textContent=h;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
function* gen(start){let day=new Date(start);day.setHours(0,0,0,0);while(1){if(day.getDay()!=0){for(const[a,b]of[[10,13],[14,17]]){let t=new Date(day);t.setHours(a,0,0,0);const e=new Date(day);e.setHours(b,0,0,0);while(t.getTime()+6e5<=e.getTime()){yield new Date(t);t=new Date(t.getTime()+6e5)}}}day.setDate(day.getDate()+1)}}
function assign(){deadline=new Date(Date.now()+DL*864e5);deadline.setHours(17,0,0,0);const g=gen(new Date(deadline.getTime()+864e5));S.forEach(s=>{s.slot=g.next().value;s.link="https://meet.google.com/your-link-here"});lastSlot=S[S.length-1].slot;assigned=true}
function find(q){let m=q.match(/\b(9\d{11})\b/);if(m)return S.find(s=>s.reg==m[1]);m=q.match(/student\s*#?(\d+)|\bno\.?\s*(\d+)|#(\d+)/i);if(m){const n=+(m[1]||m[2]||m[3]);return S[n-1]}const l=q.toLowerCase();return S.find(s=>l.includes(s.name.toLowerCase())||l.includes(s.name.split(" ")[0].toLowerCase()))}
function taskMail(s){return{sub:`Your task: ${s.task} | Deadline & review time`,body:`Hi ${s.name},\n\nYour task: ${s.task}\n\nWhat to do: ${HELP[s.task]||"Complete your task as discussed."}\n\nDEADLINE: ${fmt(deadline)}\nREVIEW MEETING: ${fmt(s.slot)} (10 min)\nMeeting link: ${s.link}\n\nIn the review, explain your work in very simple words: what you made, why, and what you learned. You will get feedback by email after the review.\n\nAll the best!\nReview Bot`}}
function mailBtns(s,m){const d=say(`📧 To: ${s.email}\nSubject: ${m.sub}\n\n${m.body}\n`);const a=document.createElement("button");a.className="p";a.textContent="Open in my email app";a.onclick=()=>location.href=`mailto:${s.email}?subject=${encodeURIComponent(m.sub)}&body=${encodeURIComponent(m.body)}`;const c=document.createElement("button");c.textContent="Copy";c.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(m.body);c.textContent="Copied ✓"};d.append(document.createElement("br"),a,c)}
function sched(){let h="<table><tr><th>#</th><th>Name</th><th>Task</th><th>Review time</th></tr>";S.forEach((s,i)=>h+=`<tr><td>${i+1}</td><td>${s.name}</td><td>${s.task}</td><td>${s.slot?fmt(s.slot):"-"}</td></tr>`);say(h+"</table>","bot",true)}
function csv(){const r=[["Register","Name","Email","Task","Deadline","Review","Link"]].concat(S.map(s=>[s.reg,s.name,s.email,s.task,fmt(deadline),fmt(s.slot),s.link]));const b=new Blob([r.map(x=>x.map(v=>`"${v}"`).join(",")).join("\n")],{type:"text/csv"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="review_schedule.csv";a.click()}
function feedbackMail(s,notes){const items=notes.split(/[\n,;]+/).map(x=>x.trim()).filter(Boolean);lastSlot=new Date((lastSlot||new Date()).getTime()+GAP*864e5);const n=gen(lastSlot).next().value;lastSlot=n;
return{sub:`Feedback on your task: ${s.task} + next review time`,body:`Hi ${s.name},\n\nThanks for attending the review of "${s.task}" and explaining your work.\n\nWHAT WENT WELL\n- You completed the task and presented it.\n\nMISTAKES / WHAT IS MISSING\n${items.map(x=>"- "+x).join("\n")}\n\nWHAT TO DO NEXT\nPlease fix the points above and be ready to explain the changes simply.\n\nNEXT REVIEW: ${fmt(n)}\nMeeting link: https://meet.google.com/your-link-here\n\nKeep going!\nReview Bot`}}
function handle(q){say(q,"me");const l=q.toLowerCase();
if(pending){const s=pending;pending=null;mailBtns(s,feedbackMail(s,q));return}
let m=l.match(/deadline\s*(\d+)/);if(m){DL=+m[1];say(`Deadline set to ${DL} days. Say "assign tasks" to apply.`);return}
if(/help|hi\b|hello/.test(l)){say('I can:\n• "assign tasks" – gives all students a task, deadline and review slot\n• "show schedule" – table of everyone\n• "email student 5" – task email with deadline + review time\n• "feedback student 5" – I ask for the mistakes, then write feedback + next review date\n• "deadline 5 days" – change deadline\n• "download" – schedule CSV\n• 📎 upload your Excel (columns: Register no, Name, Email, Task)');return}
if(/assign|allocate/.test(l)){assign();say(`✅ Assigned tasks to ${S.length} students.\nDeadline: ${fmt(deadline)}\nReviews: ${fmt(S[0].slot)} → ${fmt(S[S.length-1].slot)}\n\nSay "email student 1" to get each student's mail.`);return}
if(/schedule|list|all students/.test(l)){if(!assigned)assign();sched();return}
if(/download|csv|export/.test(l)){if(!assigned)assign();csv();say("Downloaded review_schedule.csv ✅");return}
const s=find(q);
if(/feedback|review result|mistake/.test(l)){if(!s){say('Which student? e.g. "feedback student 3"');return}if(!assigned)assign();pending=s;say(`Feedback for ${s.name} (${s.task}).\nType the mistakes you noticed, separated by commas.\nExample: venue missing, text too small, no explanation of colors`);return}
if(/mail|email|send/.test(l)){if(!s){say('Which student? e.g. "email student 3"');return}if(!assigned)assign();mailBtns(s,taskMail(s));return}
if(s){if(!assigned)assign();say(`${s.name} (${s.reg})\nTask: ${s.task}\nReview: ${fmt(s.slot)}\n\nSay "email student ${S.indexOf(s)+1}" or "feedback student ${S.indexOf(s)+1}".`);return}
say('I did not get that. Type "help" to see what I can do.')}
function go(){const v=$("t").value.trim();if(!v)return;$("t").value="";handle(v)}
$("send").onclick=go;$("t").onkeydown=e=>{if(e.key=="Enter")go()};document.querySelectorAll(".chips button").forEach(b=>b.onclick=()=>handle(b.dataset.c));
$("f").onchange=e=>{const fl=e.target.files[0];if(!fl)return;const r=new FileReader();r.onload=ev=>{try{const wb=XLSX.read(ev.target.result,{type:"array"});const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false}).slice(1).filter(x=>x[1]);S=rows.map(x=>({reg:String(x[0]),name:x[1],email:x[2],task:x[3]}));assigned=false;$("cnt").textContent=S.length+" students";say(`📎 Loaded ${S.length} students from ${fl.name}. Say "assign tasks".`)}catch(err){say("Could not read that file. Use columns: Register no, Name, Email, Task.")}};r.readAsArrayBuffer(fl)};
$("cnt").textContent=S.length+" students";
say(`Hi! 👋 I'm your Review Bot. I already loaded ${S.length} students from your Excel file.\n\nI assign tasks, set deadlines, give review date/time, and write feedback with the mistakes and next review date.\n\nTap "Assign all tasks" to start, or type "help".`);
</script></body></html>
